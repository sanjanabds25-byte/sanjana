<!DOCTYPE html>
<html>
<head>
  <title>Creative Bootstrap Page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, purple, lightpink);
    }

    .header {
      background: linear-gradient(to right, purple, pink);
      color: white;
      padding: 25px;
      text-align: center;
      border-radius: 0 0 20px 20px;
    }

    .card {
      border-radius: 15px;
      box-shadow: 0px 4px 10px gray;
    }

    .footer {
      background: linear-gradient(to right, black, gray);
      color: white;
      text-align: center;
      padding: 12px;
      margin-top: 40px;
    }

    .section-title {
      color: purple;
      font-weight: bold;
    }

    .btn-custom {
      background-color: purple;
      color: white;
    }

    .btn-custom:hover {
      background-color: darkviolet;
    }
  </style>
</head>

<body>

<div class="header">
  <h2>My Creative Webpage</h2>
  <p>Modern Bootstrap Design</p>
</div>

<div class="container mt-4">

  <!-- Login Form -->
  <div class="card p-4 mb-4">
    <h4 class="section-title">Login Form</h4>

    <form>
      <div class="mb-3">
        <label>Email address</label>
        <input type="email" class="form-control" placeholder="Enter email">
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input type="password" class="form-control" placeholder="Enter password">
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input">
        <label class="form-check-label">Remember me</label>
      </div>

      <button class="btn btn-custom w-100">Login</button>
    </form>
  </div>

  <!-- Modal Button -->
  <div class="text-center mb-4">
    <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#exampleModal">
     Launch Modal
    </button>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header bg-warning">
          <h5 class="modal-title">Welcome</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          This is a creative modal with new design
        </div>

        <div class="modal-footer">
          <button class="btn btn-dark" data-bs-dismiss="modal">Close</button>
          <button class="btn btn-success">Save</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Dropdown -->
  <div class="text-center mb-4">
    <div class="btn-group">
      <button class="btn btn-info dropdown-toggle" data-bs-toggle="dropdown">
        Choose Option
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">Profile</a></li>
        <li><a class="dropdown-item" href="#">Settings</a></li>
      </ul>
    </div>
  </div>

  <!-- Breadcrumb -->
  <nav class="mb-4">
    <ol class="breadcrumb justify-content-center bg-light p-2 rounded">
      <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
      <li class="breadcrumb-item">Pages</li>
      <li class="breadcrumb-item active">Current</li>
    </ol>
  </nav>

  <!-- Float Example -->
  <div class="card p-3">
    <h5 class="section-title">Float Example</h5>

    <div class="float-start p-2 rounded" style="background-color: lightgreen;">Left Box</div>
    <div class="float-end p-2 rounded" style="background-color: orange;">Right Box</div>

    <div class="clearfix"></div>
  </div>

</div>

<div class="footer">
  <p>Designed by You | Practical-13</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
